# Copy to the target repository's .github/workflows/atlas-health.yml.
name: Atlas Health
on:
  pull_request:

permissions:
  contents: read

jobs:
  atlas-health:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    continue-on-error: true
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - id: atlas
        uses: PonomarevRA/code-atlas/plugins/atlas-health/github@REPLACE_WITH_ATLAS_COMMIT_SHA
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: ${{ always() && steps.atlas.outputs.report-directory != '' }}
        with:
          name: atlas-health
          path: ${{ steps.atlas.outputs.report-directory }}
          retention-days: 7
