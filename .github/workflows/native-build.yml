name: Native standalone build
on:
  workflow_dispatch:
    inputs:
      windows_arm64:
        description: Attempt experimental Windows ARM64 build (dependency wheels may be unavailable)
        type: boolean
        default: false
  push:
    tags: ['v*']
permissions:
  contents: read
concurrency:
  group: native-${{ github.ref }}
  cancel-in-progress: false
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15-intel
            architecture: x64
            target: darwin-x86_64
            payload: dist/Code Atlas.app
          - runner: macos-15
            architecture: arm64
            target: darwin-arm64
            payload: dist/Code Atlas.app
          - runner: windows-latest
            architecture: x64
            target: win32-x86_64
            payload: dist/CodeAtlas
          - runner: ubuntu-24.04
            architecture: x64
            target: linux-x86_64
            payload: dist/CodeAtlas
          - runner: ubuntu-24.04-arm
            architecture: arm64
            target: linux-arm64
            payload: dist/CodeAtlas
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          architecture: ${{ matrix.architecture }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Audit public checkout before freezing
        if: github.event.repository.private == false
        run: python tools/public_release.py audit --published
      - run: python -m pip install -r requirements.lock -r packaging/requirements-build.txt
      - name: Linux desktop system libraries
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y python3-tk xvfb libegl1 libgl1 libxkbcommon-x11-0 libxcb-cursor0 libxcb-icccm4 libxcb-keysyms1 libxcb-xinerama0 libxcb-image0 libnss3 libasound2t64
      - name: Static architecture boundaries (unknown fails)
        run: python -m atlas.architecture_cli check --root . --rules architecture-rules.json
      - run: python -m pytest -q
      - name: Real Linux WebView smoke test
        if: runner.os == 'Linux'
        env:
          QTWEBENGINE_CHROMIUM_FLAGS: --disable-gpu
        run: xvfb-run -a python scripts/smoke_desktop.py
      - run: python packaging/build.py --target ${{ matrix.target }}
      - name: Offline compiled document runtime (no Python on PATH)
        run: python packaging/check_native.py
      - name: Install Windows installer compiler
        if: runner.os == 'Windows'
        run: choco install innosetup --no-progress -y
      - name: Build native request widgets
        if: runner.os == 'macOS'
        run: python packaging/widgets/macos/build.py
      - name: Build macOS setup with request widgets
        if: runner.os == 'macOS'
        run: python packaging/build_installer.py --manifest packaging/desktop-product.json --source "${{ matrix.payload }}" --output releases/local --widgets-source "packaging/widgets/macos/build/AG Requests Widgets.app"
      - name: Build Windows/Linux setup
        if: runner.os != 'macOS'
        run: python packaging/build_installer.py --manifest packaging/desktop-product.json --source "${{ matrix.payload }}" --output releases/local
      - uses: actions/upload-artifact@v4
        with:
          name: CodeAtlas-${{ matrix.target }}-installer
          path: |
            releases/local/
          if-no-files-found: error
  windows-arm64:
    if: github.event_name == 'workflow_dispatch' && inputs.windows_arm64
    runs-on: windows-11-arm
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          architecture: arm64
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Require compatible native dependencies (no emulated x64 fallback)
        run: python -m pip install -r requirements.lock -r packaging/requirements-build.txt
      - name: Static architecture boundaries (unknown fails)
        run: python -m atlas.architecture_cli check --root . --rules architecture-rules.json
      - run: python -m pytest -q
      - run: python packaging/build.py --target win32-arm64
      - run: python packaging/check_native.py
      - uses: actions/upload-artifact@v4
        with:
          name: CodeAtlas-win32-arm64-experimental
          path: dist/
          if-no-files-found: error

  release:
    if: ${{ always() && !cancelled() && startsWith(github.ref, 'refs/tags/v') }}
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Require tag to match packaged application version
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: python -c "import json,os; assert os.environ['RELEASE_TAG']=='v'+json.load(open('packaging/desktop-product.json'))['version']"
      - uses: actions/download-artifact@v4
        with:
          pattern: CodeAtlas-*-installer
          merge-multiple: true
          path: release-assets
      - name: Publish verified installers and checksums
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: python tools/publish_native_release.py --repo "$GITHUB_REPOSITORY" --tag "$RELEASE_TAG" --assets release-assets
